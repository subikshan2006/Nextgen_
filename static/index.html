<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTGEN AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">NEXTGEN AI</div>
    <button class="new-chat" id="new-chat">+ New chat</button>
    <div class="conv-list" id="conv-list"></div>
    <div class="user-box">
      <div class="u-name" id="user-name">…</div>
      <div class="links">
        <a href="/admin" id="admin-link" class="hidden">Admin</a>
        <a href="#" id="logout">Log out</a>
      </div>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <div style="font-size:13px;color:var(--text-dim)" id="chat-status">Ready</div>
      <div class="right">
        <span class="online-dot" id="online-dot" title="Model status"></span>
        <select class="model-pick" id="model-pick"></select>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <h2>NEXTGEN AI</h2>
        <p>Your trained model. Ask me anything.</p>
      </div>
    </div>

    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message NEXTGEN AI…"></textarea>
        <button class="send-btn" id="send" title="Send">➤</button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<script src="/static/js/common.js"></script>
<script>
const user = getCurrentUser();
if (!user) window.location.href = "/login";
if (user.is_admin) document.getElementById("admin-link").classList.remove("hidden");
document.getElementById("user-name").textContent = user.username + (user.is_admin ? " ★" : "");

let currentConvId = null;
let streaming = false;
let model = null;

const $input = document.getElementById("input");
const $send = document.getElementById("send");
const $messages = document.getElementById("messages");

function addMsg(role, html) {
  document.getElementById("empty-state")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = role === "user" ? "YOU" : "AI";
  div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble"></div>';
  div.querySelector(".bubble").innerHTML = html;
  $messages.appendChild(div);
  scrollBottom();
  return div.querySelector(".bubble");
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "msg assistant thinking";
  div.innerHTML = '<div class="avatar">AI</div><div class="bubble"><span class="tool-indicator"><span class="spinner"></span> thinking…</span></div>';
  $messages.appendChild(div);
  scrollBottom();
  return div.querySelector(".bubble");
}

function scrollBottom() { $messages.scrollTop = $messages.scrollHeight; }

function setStatus(txt, ok) {
  const el = document.getElementById("chat-status");
  const dot = document.getElementById("online-dot");
  el.textContent = txt;
  dot.classList.toggle("on", !!ok);
}

function autoGrow() {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 200) + "px";
}

// ---------- Conversations ----------
async function loadConversations() {
  const list = document.getElementById("conv-list");
  list.innerHTML = "";
  const convs = await api("/chat/conversations");
  if (!convs.length) return;
  for (const c of convs) {
    const btn = document.createElement("button");
    btn.className = "conv-item" + (c.id === currentConvId ? " active" : "");
    btn.innerHTML = '<span class="title"></span><button class="del" title="Delete">✕</button>';
    btn.querySelector(".title").textContent = c.title;
    btn.onclick = () => openConversation(c.id);
    btn.querySelector(".del").onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };
    list.appendChild(btn);
  }
}

async function openConversation(id) {
  currentConvId = id;
  $messages.innerHTML = "";
  document.getElementById("empty-state")?.remove();
  const msgs = await api("/chat/conversations/" + id);
  for (const m of msgs) {
    addMsg(m.role, m.role === "assistant" ? md2html(m.content) : escapeHtml(m.content));
  }
  await loadConversations();
}

async function deleteConversation(id) {
  if (!confirm("Delete this conversation?")) return;
  await api("/chat/conversations/" + id, { method: "DELETE" });
  if (id === currentConvId) { currentConvId = null; $messages.innerHTML = ""; }
  await loadConversations();
}

document.getElementById("new-chat").onclick = () => {
  if (streaming) return;
  currentConvId = null;
  $messages.innerHTML = '<div class="empty-state" id="empty-state"><h2>NEXTGEN AI</h2><p>Your trained model. Ask me anything.</p></div>';
  $input.focus();
};

// ---------- Models ----------
async function loadModels() {
  try {
    const res = await fetch("/api/models", { headers: authHeaders() });
    const data = await res.json();
    const pick = document.getElementById("model-pick");
    pick.innerHTML = "";
    for (const m of data.models) {
      const opt = document.createElement("option");
      opt.value = m.name;
      const label = m.name.split(":")[0];
      const yours = m.name.startsWith("nextgen-trained") ? " (yours)" : "";
      const size = m.size_gb ? " · " + m.size_gb + "GB" : "";
      const fast = (m.size_gb ?? 99) < 3 ? " · fast" : "";
      opt.textContent = label + yours + size + fast;
      pick.appendChild(opt);
    }
    if (data.reachable) { setStatus("Online", true); } else { setStatus("Model server offline", false); }
  } catch { setStatus("Offline", false); }
}

// ---------- Queued chat (GPU worker polls Vercel; no tunnel needed) ----------
async function send() {
  const text = $input.value.trim();
  if (!text || streaming) return;
  $input.value = ""; autoGrow();
  addMsg("user", escapeHtml(text).replace(/\n/g, "<br>"));
  const thinking = addThinking();
  streaming = true;
  $send.disabled = true;

  const body = { message: text };
  if (currentConvId) body.conversation_id = currentConvId;
  if (model) body.model = model;

  try {
    const job = await api("/chat/job", { method: "POST", body: JSON.stringify(body) });
    currentConvId = job.conversation_id;

    let result = null;
    for (let i = 0; i < 800; i++) {           // up to ~20 min
      await new Promise(r => setTimeout(r, 1500));
      try {
        result = await api("/chat/job/" + job.job_id);
      } catch { continue; }
      if (result.status === "done" || result.status === "error") break;
    }
    if (!result) throw new Error("Timed out waiting for the model");
    if (result.status === "error") {
      thinking.innerHTML = '<span class="bad">Error: ' + escapeHtml(result.error || "unknown") + "</span>";
    } else {
      thinking.closest(".msg").remove();
      const bubble = addMsg("assistant", "");
      bubble.innerHTML = result.response && result.response.trim()
        ? md2html(result.response)
        : '<span class="text-dim">(no response)</span>';
    }
  } catch (err) {
    thinking.innerHTML = '<span class="bad">Error: ' + escapeHtml(err.message) + "</span>";
  } finally {
    streaming = false;
    $send.disabled = false;
    await loadConversations();
  }
}

$send.onclick = send;
$input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$input.addEventListener("input", autoGrow);
document.getElementById("model-pick").onchange = (e) => { model = e.target.value; };

document.getElementById("logout").onclick = (e) => {
  e.preventDefault();
  clearToken();
  localStorage.removeItem("nextgen_user");
  window.location.href = "/login";
};

loadModels();
loadConversations();
$input.focus();
</script>
</body>
</html>
